<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌詞省字王 - 模組化互動教具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #050505;
            color: #fff;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

        .tab-header {
            text-align: center;
            font-weight: bold;
            font-size: 1.125rem;
            padding: 0.75rem 0;
            margin-bottom: 0.5rem;
            position: relative;
        }

        .hide-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #555 #1a1a1a;
        }

        /* 歌詞文字選取時的顏色 */
        ::selection {
            background-color: #ed7d31;
            color: white;
        }

        /* 歌詞顯示區保留換行格式 */
        .source-text-display {
            white-space: pre-wrap;
            word-break: break-word;
            user-select: text;
        }

        .ch { cursor: text; }

        /* 還沒有被任何模組涵蓋的字：灰色 + 虛線底線 */
        .ch.uncov {
            color: #9ca3af;
            text-decoration: underline dashed #6b7280;
            text-underline-offset: 6px;
        }

        /* 已定義模組在歌詞中的標示 (跨行也能正確顯示外框) */
        .mod-mark {
            position: relative;
            background: rgba(234, 88, 12, 0.25);
            color: #fed7aa;
            border: 1px solid rgba(234, 88, 12, 0.55);
            border-radius: 4px;
            padding: 0 2px;
            margin: 0 1px;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
        }
        .mod-badge {
            position: absolute;
            top: -0.75rem;
            left: -0.5rem;
            width: 1.15rem;
            height: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            background: #dc2626;
            border: 1px solid #991b1b;
            color: #fff;
            font-size: 10px;
            font-weight: 900;
            line-height: 1;
            user-select: none;
            pointer-events: none;
            z-index: 1;
        }
        .uncov-sample {
            color: #fff;
            font-weight: 700;
            text-decoration: underline dashed #6b7280;
            text-underline-offset: 4px;
        }

        /* ===== 版面：精簡欄位標題、序列方塊、下方資訊 ===== */
        .tab-header { padding: 0.4rem 0; margin-bottom: 0; font-size: 1rem; }
        .tab-arrow-r, .tab-arrow-l { position:absolute; top:0; width:0; height:0; border-top:1.2rem solid transparent; border-bottom:1.2rem solid transparent; border-left:1rem solid; z-index:20; }
        .tab-arrow-r { right:-1rem; }
        .tab-arrow-l { left:0; }
        #resultStatusDisplay { padding: 0.3rem 0.75rem !important; font-size: 0.95rem !important; border-width: 1px !important; text-align: center; border-radius: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #resultStatusDisplay .text-4xl { font-size: 1.5rem !important; line-height: 1; }
        #resultStatusDisplay .block { display: inline !important; }
        #resultStatusDisplay span.text-base { display: none !important; }
        #seqToolbar:empty { display: none; }
        #seqToolbar .w-full { display: none; }
        .seq-del { position: absolute; top: -7px; right: -7px; width: 17px; height: 17px; border-radius: 9999px; background: #dc2626; border: 1px solid #7f1d1d; color: #fff; font-size: 10px; font-weight: 900; line-height: 15px; text-align: center; display: none; z-index: 2; }
        .seq-del:hover { background: #ef4444; transform: scale(1.15); }
        #sequenceDisplay > span:hover .seq-del, #sequenceDisplay > span.is-selected .seq-del { display: block; }
        #sequenceDisplay > span.rounded-md { width: 2.1rem !important; height: 2.1rem !important; font-size: 1.1rem; }
        #sequenceDisplay > span.w-1 { height: 2.1rem !important; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <!-- 提示訊息框 (Toast) -->
    <div id="toastMessage" class="fixed top-5 left-1/2 -translate-x-1/2 transform bg-red-600 text-white font-bold px-6 py-3 rounded shadow-2xl z-50 transition-opacity duration-300 opacity-0 pointer-events-none max-w-[90vw] text-center"></div>

    <!-- 確認視窗 -->
    <div id="confirmModal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4">
        <div class="bg-[#1a1a1a] border border-gray-700 rounded-xl p-5 max-w-sm w-full shadow-2xl">
            <div id="confirmText" class="text-white text-lg mb-5 whitespace-pre-wrap leading-relaxed"></div>
            <div class="flex justify-end gap-3">
                <button onclick="hideConfirm()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-5 rounded">取消</button>
                <button id="confirmOk" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-5 rounded">刪除</button>
            </div>
        </div>
    </div>

    <!-- 標題列：標題 + 五首成績 + 帳號 + 復原 (合併成一排) -->
    <header class="bg-[#111] px-3 py-2 border-b border-gray-800 flex items-center gap-3 z-10 shrink-0 shadow-md">
        <h1 class="text-[1.875rem] leading-none font-black tracking-wider text-white shrink-0">歌詞省字王</h1>
        <nav id="scoreboard" class="flex-1 min-w-0 flex flex-wrap items-center gap-2"></nav>
        <div id="accountInfo" class="hidden text-xs text-gray-400 text-right leading-tight shrink-0">
            <div id="accountEmail"></div>
            <div id="syncStatus"></div>
        </div>
        <button id="undoBtn" onclick="undo()" title="復原上一步 (Ctrl+Z)" class="shrink-0 bg-gray-800 hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-gray-800 text-white text-sm font-bold py-1.5 px-4 rounded border border-gray-600 transition-colors">↶ 復原</button>
    </header>

    <!-- 歌曲改由成績列切換，選單保留但隱藏 -->
    <select id="songSelector" onchange="changeSong()" class="hidden">
        <option value="star">1. 小星星</option>
        <option value="congrats">2. 恭喜恭喜</option>
        <option value="bird">3. 飛鳥和蟬</option>
        <option value="content">4. 知足</option>
        <option value="balloon">5. 告白氣球</option>
    </select>

    <!-- 三欄共用同一套格線：標題 / 上方工具 / 歌詞區 / 下方資訊 -->
    <main class="flex-1 min-h-0 grid grid-cols-3" style="grid-template-rows: auto auto minmax(0, 1fr) auto;">

        <!-- 第 1 排：欄位標題 -->
        <div class="tab-header bg-[#ed7d31] shadow-lg shadow-orange-900/50 text-white z-10 relative">
            1. 原始歌詞
            <div class="tab-arrow-r" style="border-left-color:#ed7d31"></div>
        </div>
        <div class="tab-header bg-[#c07062] shadow-lg shadow-red-900/50 text-white z-10 relative">
            <div class="tab-arrow-l" style="border-left-color:#0a0a0a"></div>
            2. 定義模組
            <div class="tab-arrow-r" style="border-left-color:#c07062"></div>
        </div>
        <div class="tab-header bg-[#a6a6a6] shadow-lg shadow-gray-900/50 text-black z-10 relative">
            <div class="tab-arrow-l" style="border-left-color:#111"></div>
            3. 呼叫模組、重組歌詞
        </div>

        <!-- 第 2 排：上方工具 -->
        <div class="bg-[#0a0a0a] border-r border-gray-800 px-4 pt-3 flex flex-col gap-2">
            <div class="bg-[#1a1a1a] px-3 py-2 rounded border border-gray-800 text-sm text-gray-400 font-medium">
                💡 <span class="uncov-sample">虛線字</span>＝還沒有被任何模組定義的歌詞
            </div>
        </div>
        <div class="bg-[#111] border-r border-gray-800 px-4 pt-3 flex flex-col gap-2">
            <div class="bg-[#1a1a1a] px-3 py-2 rounded border border-gray-800 text-sm text-gray-400 font-medium">
                💡 在左側歌詞<b class="text-gray-200">拖曳反白</b>就會定義成模組
            </div>
        </div>
        <div class="bg-gray-950 px-4 pt-3">
            <div class="bg-[#1a1a1a] border border-gray-700 rounded-lg p-2 flex flex-col shadow-inner">
                <div class="flex items-start gap-2">
                <div id="sequenceDisplay" class="flex-1 min-w-0 flex flex-wrap items-center gap-1 text-xl font-bold text-yellow-400 content-start min-h-[2.3rem] max-h-28 overflow-y-auto hide-scrollbar px-1.5 pt-2 pb-1"></div>
                <span id="sequenceLengthCount" class="shrink-0 mt-1.5 bg-gray-700 text-gray-200 text-sm font-bold px-2.5 py-0.5 rounded-full">0 字</span>
                </div>
                <div id="seqToolbar" class="hidden"></div>
            </div>
        </div>

        <!-- 第 3 排：歌詞區 (左右等高) -->
        <div class="bg-[#0a0a0a] border-r border-gray-800 px-4 py-3 min-h-0 flex flex-col">
            <div id="sourceTextDisplay" class="source-text-display w-full flex-1 bg-[#111827] border border-gray-700 rounded p-4 text-lg leading-[1.8] text-gray-200 overflow-y-auto hide-scrollbar shadow-inner"></div>
        </div>
        <div class="bg-[#111] border-r border-gray-800 px-4 py-3 min-h-0 flex flex-col gap-2">
            <div id="moduleListVertical" class="flex-1 min-h-0 overflow-y-auto hide-scrollbar flex flex-col gap-2 relative z-10 py-1 pr-1"></div>
        </div>
        <div class="bg-gray-950 px-4 py-3 min-h-0 flex flex-col">
            <div id="previewScroll" class="flex-1 min-h-0 bg-[#111827] border border-gray-700 rounded p-4 overflow-y-auto hide-scrollbar shadow-inner relative">
                <div class="absolute top-2 right-2 text-xs text-gray-600 font-bold bg-black/50 px-2 py-1 rounded">重組歌詞結果</div>
                <div id="previewArea" class="text-white text-lg leading-[1.8] whitespace-pre-wrap">組合結果將顯示於此...</div>
            </div>
        </div>

        <!-- 第 4 排：各欄下方資訊 (精簡成一～兩行) -->
        <div class="bg-black border-t border-r border-gray-800 px-4 py-2 flex items-center justify-center gap-3 text-sm text-gray-400 whitespace-nowrap">
            <span>原始歌詞 <b id="originalCharCount" class="text-white text-xl">0</b> 字</span>
            <span class="text-gray-700">｜</span>
            <span>模組涵蓋 <b id="coveragePercent" class="text-white text-xl">0</b>%</span>
            <span id="coverageNote" class="text-xs text-gray-500"></span>
        </div>
        <div class="bg-[#0a0a0a] border-t border-r border-gray-800 px-4 py-2 flex items-center justify-center text-sm text-gray-400 whitespace-nowrap">
            <span>已定義模組字數 <b id="defTotalCount" class="text-yellow-400 text-xl">0</b> 字<span class="text-xs text-gray-500">（<span id="defBreakdown"></span>）</span></span>
        </div>
        <div class="relative bg-black border-t border-gray-800 px-4 py-2 flex flex-col justify-center text-sm text-gray-400">
            <!-- 只有一行：過程中顯示還原進度；有錯顯示「錯誤請修正」；完成後換成「成功還原」 -->
            <div class="flex items-center gap-3 whitespace-nowrap h-9">
                <div id="progressLine" class="flex-1 min-w-0 flex items-center gap-2">
                    <span class="shrink-0">還原</span>
                    <div class="flex-1 h-2.5 bg-gray-800 rounded-full overflow-hidden">
                        <div id="restoreBar" class="h-full bg-sky-500 transition-all duration-300" style="width:0%"></div>
                    </div>
                    <span id="restorePercent" class="text-white font-bold w-11 text-right">0%</span>
                </div>
                <div id="errorBox" class="hidden flex-1 min-w-0 rounded-lg px-3 py-1 text-center font-bold bg-red-900 text-white border border-red-700">❌ 錯誤請修正</div>
                <div id="successBanner" class="hidden flex-1 min-w-0 rounded-lg px-3 py-0.5 text-lg text-center font-black bg-[#e8c338] text-black border border-yellow-500 shadow-[0_0_12px_rgba(232,195,56,0.5)] overflow-hidden text-ellipsis"></div>
                <span class="shrink-0">模組化 <span id="formulaDisplay" class="text-gray-500"></span> <b id="modularCharCount" class="text-yellow-400 text-xl">0</b> 字</span>
            </div>
            <div id="resultStatusDisplay" class="hidden"></div>
            <div class="absolute bottom-0.5 right-1.5 text-[9px] text-gray-700 leading-none pointer-events-none">桃園市建國國中詹智傑老師製作(2026)</div>
        </div>
        </div>
    </main>

        // ===================== 共用小工具 =====================

        const esc = (str) => str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        function getRaw() {
            return songLyrics[document.getElementById('songSelector').value];
        }

        function countVisibleChars(str) {
            return str.replace(/\s+/g, '').length; // 忽略所有空白與換行計算純字數
        }

        // 把多行文字縮短成一行，方便在提示中顯示
        function shortText(text, max) {
            const oneLine = text.replace(/\n+/g, ' / ');
            return oneLine.length > max ? oneLine.slice(0, max) + '…' : oneLine;
        }

        // ===================== 提示訊息與確認視窗 =====================

        let toastTimer1 = null, toastTimer2 = null;
        function showMessage(text, type = 'error') {
            const colors = { error: 'bg-red-600', info: 'bg-sky-600', success: 'bg-emerald-600' };
            const toast = document.getElementById('toastMessage');
            toast.className = `fixed top-5 left-1/2 -translate-x-1/2 transform ${colors[type] || colors.error} text-white font-bold px-6 py-3 rounded shadow-2xl z-50 transition-opacity duration-300 opacity-0 pointer-events-none max-w-[90vw] text-center`;
            toast.innerText = text;
            clearTimeout(toastTimer1);
            clearTimeout(toastTimer2);
            toastTimer1 = setTimeout(() => toast.classList.remove('opacity-0'), 10);
            toastTimer2 = setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        function askConfirm(text, onOk) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmText').innerText = text;
            document.getElementById('confirmOk').onclick = () => { hideConfirm(); onOk(); };
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function hideConfirm() {
            const modal = document.getElementById('confirmModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ===================== 復原 =====================

        function snapshot() {
            history.push(JSON.stringify({ modules, sequence }));
            if (history.length > 100) history.shift();
            updateUndoBtn();
        }

        function undo() {
            if (history.length === 0) {
                showMessage('沒有可以復原的動作', 'info');
                return;
            }
            const s = JSON.parse(history.pop());
            modules = s.modules;
            sequence = s.sequence;
            seqCursor = null;
            updateAll();
            showMessage('已復原上一步', 'info');
        }

        function updateUndoBtn() {
            document.getElementById('undoBtn').disabled = history.length === 0;
        }

        // ===================== 初始化 =====================

        window.onload = () => {
            // 拖曳反白放開時，立即定義模組 (拖曳可能在歌詞區外放開，所以監聽整個頁面)
            document.addEventListener('mouseup', () => setTimeout(defineFromSelection, 0));
            document.addEventListener('touchend', () => setTimeout(defineFromSelection, 0));
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    undo();
                } else if (e.key === 'Escape') {
                    hideConfirm();
                    if (seqCursor !== null) { seqCursor = null; refreshSequence(); }
                }
            });
            linkScroll(document.getElementById('sourceTextDisplay'), document.getElementById('previewScroll'));
            window.addEventListener('resize', matchScrollHeight);
            changeSong();
            initAccount();
        };

        // ===================== 左右歌詞區同步捲動 =====================

        // 捲動其中一邊，另一邊跟著捲到同樣位置，方便逐行比對
        function linkScroll(a, b) {
            let leader = null, timer = null;
            const follow = (src, dst) => () => {
                if (leader && leader !== src) return; // 這是被帶動的捲動，不再反向帶動
                leader = src;
                dst.scrollTop = src.scrollTop;
                clearTimeout(timer);
                timer = setTimeout(() => { leader = null; }, 100);
            };
            a.addEventListener('scroll', follow(a, b));
            b.addEventListener('scroll', follow(b, a));
        }

        // 讓右邊至少和左邊一樣高，即使右邊還沒有文字也能一起捲動
        function matchScrollHeight() {
            const left = document.getElementById('sourceTextDisplay');
            const right = document.getElementById('previewScroll');
            const preview = document.getElementById('previewArea');
            const pad = parseFloat(getComputedStyle(right).paddingTop) + parseFloat(getComputedStyle(right).paddingBottom);
            preview.style.minHeight = Math.max(0, left.scrollHeight - pad) + 'px';
        }

        function changeSong() {
            // 先把目前這首歌的作答狀態存起來
            if (currentSong) {
                songStates[currentSong] = { modules, sequence, history, solvedTime };
            }
            // 載入新歌曲之前的作答狀態 (沒有就從頭開始)
            currentSong = document.getElementById('songSelector').value;
            const s = songStates[currentSong];
            modules = s ? s.modules : [];
            sequence = s ? s.sequence : [];
            history = s ? s.history : [];
            solvedTime = s ? s.solvedTime : null;
            seqCursor = null;
            updateAll();
            document.getElementById('sourceTextDisplay').scrollTop = 0; // 換歌時回到最上方
            document.getElementById('previewScroll').scrollTop = 0;
        }

        function updateAll() {
            renderSourceText();
            updateModuleListUI();
            updateSequenceUI();
            updateStatsAndPreview();
            updateUndoBtn();
            matchScrollHeight();
        }

        function refreshSequence() {
            updateSequenceUI();
            updateStatsAndPreview();
            updateUndoBtn();
            matchScrollHeight();
        }

        // ===================== 1. 選取歌詞 → 定義模組 =====================

        // 把反白範圍換算成歌詞中的字元位置 (只算和反白真的有重疊的字)
        function selectionToRange() {
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
            const box = document.getElementById('sourceTextDisplay');
            const range = sel.getRangeAt(0);
            if (!range.intersectsNode(box)) return null;

            let min = null, max = null;
            box.querySelectorAll('[data-i]').forEach(span => {
                const r = document.createRange();
                r.selectNodeContents(span);
                if (range.compareBoundaryPoints(Range.END_TO_START, r) < 0 &&
                    range.compareBoundaryPoints(Range.START_TO_END, r) > 0) {
                    const i = Number(span.dataset.i);
                    if (min === null) min = i;
                    max = i;
                }
            });
            return min === null ? null : [min, max];
        }

        function cleanText(text) {
            // 移除前後空白，以及每一行開頭的空白
            return text.trim().split('\n').map(line => line.replace(/^[ \t　]+/, '')).join('\n');
        }

        // 放開滑鼠時：若有反白歌詞，就直接定義成模組
        function defineFromSelection() {
            const r = selectionToRange();
            if (!r) return;
            const sel = window.getSelection();
            const text = cleanText(getRaw().substring(r[0], r[1] + 1));
            sel.removeAllRanges();
            if (!text) return; // 只選到空白

            // 不允許選到已經屬於某個模組的字 (有橘色標示的歌詞)
            const raw = getRaw();
            const { owner, occs } = computeCoverage(raw);
            const overlapIds = [];
            for (let i = r[0]; i <= r[1]; i++) {
                if (owner[i] !== null && !/\s/.test(raw[i])) {
                    const id = occs[owner[i]].id;
                    if (!overlapIds.includes(id)) overlapIds.push(id);
                }
            }
            if (overlapIds.length > 0) {
                showMessage(`選到的字已經屬於模組 ${overlapIds.join('、')}，請只選還沒有標示的歌詞`);
                return;
            }

            // 檢查是否已存在相同的模組內容
            const dup = modules.find(m => m.text === text);
            if (dup) {
                showMessage(`這段已經是模組 ${dup.id} 了`, 'info');
                return;
            }

            // 尋找可用的最小代號 (A-Z)
            const usedIds = modules.map(m => m.id);
            let nextId = null;
            for (let i = 65; i <= 90; i++) {
                const c = String.fromCharCode(i);
                if (!usedIds.includes(c)) { nextId = c; break; }
            }
            if (!nextId) {
                showMessage('最多26個模組');
                return;
            }

            snapshot();
            modules.push({ id: nextId, text });
            modules.sort((a, b) => a.id.localeCompare(b.id));
            updateAll();
            showMessage(`已定義模組 ${nextId}`, 'success');
        }

        // ===================== 2. 模組清單、刪除 =====================

        function removeModule(id) {
            const mod = modules.find(m => m.id === id);
            if (!mod) return;
            const uses = sequence.filter(s => s === id).length;
            let msg = `確定要刪除模組 ${id}「${shortText(mod.text, 20)}」嗎？`;
            if (uses > 0) msg += `\n\n序列中的 ${uses} 個 ${id} 也會一起移除。`;
            askConfirm(msg, () => {
                snapshot();
                modules = modules.filter(m => m.id !== id);
                sequence = sequence.filter(s => s !== id);
                seqCursor = null;
                updateAll();
                showMessage(`已刪除模組 ${id}，按「↶ 復原」可以救回來`, 'info');
            });
        }

        function updateModuleListUI() {
            const list = document.getElementById('moduleListVertical');
            list.innerHTML = '';

            if (modules.length === 0) {
                list.innerHTML = '<div class="text-gray-600 text-center text-xs px-2 mt-4 w-full">尚未建立</div>';
                return;
            }

            modules.forEach(mod => {
                const row = document.createElement('div');
                row.className = 'w-full flex items-stretch bg-[#2a110d] border border-[#c07062] rounded-lg shadow-md shrink-0 overflow-hidden';

                // 主要區域：點擊加入序列
                const btn = document.createElement('button');
                btn.className = 'flex-1 min-w-0 flex items-center text-left hover:bg-[#c07062] p-2 transition-colors group';
                btn.title = `呼叫模組 ${mod.id}`;
                btn.onclick = () => addToSequence(mod.id);

                const idSpan = document.createElement('span');
                idSpan.className = 'text-[#ffb4a6] group-hover:text-white font-black text-2xl w-10 shrink-0 text-center transition-colors';
                idSpan.textContent = mod.id;

                const textWrap = document.createElement('span');
                textWrap.className = 'border-l border-[#c07062]/50 group-hover:border-white/50 pl-3 ml-1 flex-1 min-w-0 flex flex-col gap-1 transition-colors';

                const textSpan = document.createElement('span');
                textSpan.className = 'text-white text-sm leading-[1.8] whitespace-pre-wrap';
                textSpan.textContent = mod.text;

                textWrap.appendChild(textSpan);
                btn.appendChild(idSpan);
                btn.appendChild(textWrap);

                // 刪除按鈕
                const del = document.createElement('button');
                del.className = 'px-3 text-gray-400 hover:text-white hover:bg-red-700 border-l border-[#c07062]/50 transition-colors text-lg shrink-0';
                del.textContent = '✕';
                del.title = `刪除模組 ${mod.id}`;
                del.onclick = () => removeModule(mod.id);

                row.appendChild(btn);
                row.appendChild(del);
                list.appendChild(row);
            });
        }

        // ===================== 3. 呼叫序列 =====================

        function addToSequence(id) {
            snapshot();
            if (seqCursor !== null) {
                // 有選取方塊時，插入在它後面
                sequence.splice(seqCursor + 1, 0, id);
                seqCursor = seqCursor + 1;
            } else {
                sequence.push(id);
            }
            refreshSequence();
        }

        function backspaceSeq() {
            if (sequence.length === 0) {
                showMessage('序列是空的', 'info');
                return;
            }
            snapshot();
            if (seqCursor !== null) {
                sequence.splice(seqCursor, 1);
                seqCursor = seqCursor > 0 ? seqCursor - 1 : null;
                if (sequence.length === 0) seqCursor = null;
            } else {
                sequence.pop();
            }
            refreshSequence();
        }

        function clearSequence() {
            if (sequence.length === 0) return;
            snapshot();
            sequence = [];
            seqCursor = null;
            refreshSequence();
            showMessage('已清除序列，按「↶ 復原」可以救回來', 'info');
        }

        function moveSeq(from, to) {
            if (from === null || to === null || from === to) return;
            if (to < 0 || to >= sequence.length) return;
            snapshot();
            const [item] = sequence.splice(from, 1);
            sequence.splice(to, 0, item);
            refreshSequence();
        }

        function seqShift(dir) {
            if (seqCursor === null) return;
            const to = seqCursor + dir;
            if (to < 0 || to >= sequence.length) return;
            moveSeq(seqCursor, to);
            seqCursor = to;
            refreshSequence();
        }

        function seqDeselect() {
            seqCursor = null;
            refreshSequence();
        }

        function updateSequenceUI() {
            const display = document.getElementById('sequenceDisplay');
            const toolbar = document.getElementById('seqToolbar');
            display.innerHTML = '';

            if (sequence.length === 0) {
                display.innerHTML = '<span class="text-gray-400 text-sm font-normal items-center flex">點擊中間模組清單的代號來排列順序...</span>';
                toolbar.innerHTML = '';
                return;
            }

            sequence.forEach((id, index) => {
                const selected = index === seqCursor;
                const item = document.createElement('span');
                item.className = selected
                    ? 'is-selected relative cursor-pointer select-none bg-sky-800 border-2 border-sky-300 text-white rounded-md w-10 h-10 flex items-center justify-center shadow-[0_0_10px_rgba(56,189,248,0.7)] shrink-0 transition-all'
                    : 'relative cursor-pointer select-none bg-yellow-900/50 border border-yellow-600 text-yellow-400 rounded-md w-10 h-10 flex items-center justify-center hover:border-sky-400 hover:text-sky-300 transition-all shadow-md shrink-0';
                item.innerText = id;
                item.title = `第 ${index + 1} 步：點一下選取，新呼叫的模組會插在它後面`;
                // 滑過方塊 (或選取時) 右上角出現 ✕，點一下刪除這一步
                const del = document.createElement('button');
                del.className = 'seq-del';
                del.textContent = '✕';
                del.title = `刪除第 ${index + 1} 步`;
                del.onclick = (e) => {
                    e.stopPropagation();
                    snapshot();
                    sequence.splice(index, 1);
                    if (seqCursor !== null) {
                        if (seqCursor === index) seqCursor = null;
                        else if (seqCursor > index) seqCursor--;
                    }
                    refreshSequence();
                };
                item.appendChild(del);
                item.draggable = true;
                item.onclick = () => {
                    seqCursor = (seqCursor === index) ? null : index;
                    refreshSequence();
                };
                // 電腦滑鼠可直接拖曳排序
                item.ondragstart = (e) => {
                    dragIndex = index;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', String(index));
                };
                item.ondragover = (e) => {
                    e.preventDefault();
                    item.classList.add('ring-2', 'ring-orange-400');
                };
                item.ondragleave = () => item.classList.remove('ring-2', 'ring-orange-400');
                item.ondrop = (e) => {
                    e.preventDefault();
                    seqCursor = null;
                    moveSeq(dragIndex, index);
                    dragIndex = null;
                };
                display.appendChild(item);

                // 插入點游標：新模組會插在這裡
                if (selected) {
                    const caret = document.createElement('span');
                    caret.className = 'w-1 h-10 bg-sky-400 rounded animate-pulse shrink-0';
                    caret.title = '新呼叫的模組會插入在這裡';
                    display.appendChild(caret);
                }
            });

            if (seqCursor === null) {
                toolbar.innerHTML = '';
            } else {
                const btnCls = 'bg-gray-700 hover:bg-gray-600 text-white px-2 py-0.5 rounded disabled:opacity-30';
                toolbar.innerHTML = `
                    <span class="text-sky-300 font-bold">第 ${seqCursor + 1} 步「${sequence[seqCursor]}」</span>
                    <button class="${btnCls}" onclick="seqShift(-1)" ${seqCursor === 0 ? 'disabled' : ''}>◀ 左移</button>
                    <button class="${btnCls}" onclick="seqShift(1)" ${seqCursor === sequence.length - 1 ? 'disabled' : ''}>右移 ▶</button>
                    <button class="bg-red-800 hover:bg-red-700 text-white px-2 py-0.5 rounded" onclick="backspaceSeq()">✕ 刪除</button>
                    <button class="${btnCls}" onclick="seqDeselect()">取消選取</button>
                    <span class="w-full text-gray-500">新呼叫的模組會插入在它後面（藍色游標處）</span>`;
            }
        }

        // ===================== 歌詞標示 (模組 + 未涵蓋) =====================

        // 找出每個字屬於哪個模組 (長的模組優先，不重疊)
        function computeCoverage(raw) {
            const owner = new Array(raw.length).fill(null);
            const occs = [];
            const sorted = [...modules].sort((a, b) => b.text.length - a.text.length);
            sorted.forEach(mod => {
                let from = 0;
                while (true) {
                    const p = raw.indexOf(mod.text, from);
                    if (p === -1) break;
                    const end = p + mod.text.length;
                    let free = true;
                    for (let j = p; j < end; j++) {
                        if (owner[j] !== null) { free = false; break; }
                    }
                    if (free) {
                        for (let j = p; j < end; j++) owner[j] = occs.length;
                        occs.push({ id: mod.id, start: p, end: end - 1 });
                        from = end;
                    } else {
                        from = p + 1;
                    }
                }
            });
            return { owner, occs };
        }

        function renderSourceText() {
            const raw = getRaw();
            const { owner, occs } = computeCoverage(raw);

            let html = '';
            let total = 0, covered = 0;
            for (let i = 0; i < raw.length; i++) {
                const o = owner[i];
                if (o !== null && occs[o].start === i) {
                    html += `<mark class="mod-mark"><span class="mod-badge">${occs[o].id}</span>`;
                }
                const c = raw[i];
                const isWs = /\s/.test(c);
                if (!isWs) {
                    total++;
                    if (o !== null) covered++;
                }
                const cls = 'ch' + (!isWs && o === null ? ' uncov' : '');
                html += `<span data-i="${i}" class="${cls}">${esc(c)}</span>`;
                if (o !== null && occs[o].end === i) html += '</mark>';
            }
            document.getElementById('sourceTextDisplay').innerHTML = html;

            // 涵蓋率
            const pct = total ? Math.floor(covered / total * 100) : 0;
            document.getElementById('coveragePercent').innerText = pct;
            document.getElementById('coverageNote').innerText = covered === total ? '✅ 全部涵蓋' : `還差 ${total - covered} 字`;
        }

        // ===================== 統計與預覽 =====================

        function setRestoreProgress(pct) {
            document.getElementById('restoreBar').style.width = pct + '%';
            document.getElementById('restorePercent').innerText = pct + '%';
            document.getElementById('restoreBar').className = 'h-full transition-all duration-300 ' + (pct === 100 ? 'bg-emerald-500' : 'bg-sky-500');
        }

        function updateStatsAndPreview() {
            const originalText = getRaw();
            const originalCount = countVisibleChars(originalText);
            document.getElementById('originalCharCount').innerText = originalCount;

            const defSymbolCount = modules.length;
            let defTextCount = 0;
            modules.forEach(mod => { defTextCount += countVisibleChars(mod.text); });
            const defTotalCount = defSymbolCount + defTextCount;
            document.getElementById('defTotalCount').innerText = defTotalCount;
            document.getElementById('defBreakdown').innerText = `代號 ${defSymbolCount} + 內容 ${defTextCount}`;

            document.getElementById('sequenceLengthCount').innerHTML = `<span class="text-yellow-400">${sequence.length}</span> 字`;

            const previewArea = document.getElementById('previewArea');
            const resultStatusDisplay = document.getElementById('resultStatusDisplay');
            const formulaDisplay = document.getElementById('formulaDisplay');
            const modularCharCount = document.getElementById('modularCharCount');

            // 如果沒有序列，顯示初始狀態
            if (sequence.length === 0) {
                previewArea.innerHTML = '<span class="text-gray-600">組合結果將顯示於此...</span>';
                formulaDisplay.innerHTML = `<span class="text-yellow-400">${defTotalCount}</span>＋<span class="text-yellow-400">0</span>＝`;
                modularCharCount.innerText = defTotalCount;
                setRestoreProgress(0);
                resultStatusDisplay.className = "hidden";
                resultStatusDisplay.innerHTML = `等待重組中...`;
                showSolved(false);
                solvedTime = null;
                renderScoreboard();
                return;
            }

            // 產生重組預覽文字
            let previewTextRaw = '';
            sequence.forEach(id => {
                const mod = modules.find(m => m.id === id);
                if (mod) previewTextRaw += mod.text;
            });

            // 進行智慧排版對齊比對
            const origClean = originalText.replace(/\s+/g, '');
            const prevClean = previewTextRaw.replace(/\s+/g, '');

            // 建立無空白原始字串與帶空白原始字串的 index 對應表
            let origIndexMap = [];
            for (let i = 0; i < originalText.length; i++) {
                if (!/\s/.test(originalText[i])) origIndexMap.push(i);
            }

            // 找出兩者從頭開始完全相符的「純文字」長度
            let matchLen = 0;
            while (matchLen < origClean.length && matchLen < prevClean.length && origClean[matchLen] === prevClean[matchLen]) {
                matchLen++;
            }

            let correctText = "";
            let incorrectText = "";

            if (matchLen === 0) {
                incorrectText = previewTextRaw;
            } else {
                let lastOrigIndex = origIndexMap[matchLen - 1];
                let stopIndex = lastOrigIndex + 1;
                while (stopIndex < originalText.length && /\s/.test(originalText[stopIndex])) {
                    stopIndex++;
                }
                correctText = originalText.substring(0, stopIndex);

                if (matchLen < prevClean.length) {
                    let pValid = 0;
                    let pCutIndex = 0;
                    for (let i = 0; i < previewTextRaw.length; i++) {
                        if (!/\s/.test(previewTextRaw[i])) pValid++;
                        if (pValid > matchLen) { pCutIndex = i; break; }
                    }
                    incorrectText = previewTextRaw.substring(pCutIndex);
                }
            }

            // 序列中選取了方塊時，算出那一步在重組歌詞中的範圍 (以不含空白的字數計)
            let hlStart = -1, hlEnd = -1;
            if (seqCursor !== null && seqCursor < sequence.length) {
                let pos = 0;
                for (let k = 0; k < seqCursor; k++) {
                    const m = modules.find(x => x.id === sequence[k]);
                    if (m) pos += countVisibleChars(m.text);
                }
                const cur = modules.find(x => x.id === sequence[seqCursor]);
                hlStart = pos;
                hlEnd = pos + (cur ? countVisibleChars(cur.text) : 0);
            }
            const hlId = seqCursor !== null ? sequence[seqCursor] : '';
            previewArea.innerHTML = buildPreviewHTML(correctText, incorrectText, hlStart, hlEnd, hlId);
            const stepMark = previewArea.querySelector('.step-mark');
            if (stepMark) stepMark.scrollIntoView({ block: 'nearest' });

            // 還原進度 (從頭開始正確的比例)
            setRestoreProgress(Math.floor(matchLen / origClean.length * 100));

            // 計算模組化後總字數
            const sequenceCount = sequence.length;
            const modularTotalCount = defTotalCount + sequenceCount;
            modularCharCount.innerText = modularTotalCount;
            formulaDisplay.innerHTML = `<span class="text-yellow-400">${defTotalCount}</span>＋<span class="text-yellow-400">${sequenceCount}</span>＝`;

            let savedCount = originalCount - modularTotalCount;

            if (origClean === prevClean) {
                // 第一次達成這個解法時記下時間 (切換歌曲再回來仍顯示原本的時間)
                if (!solvedTime) {
                    const now = new Date();
                    const days = ['日', '一', '二', '三', '四', '五', '六'];
                    solvedTime = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日星期${days[now.getDay()]} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
                    lastSolvedStamp = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
                }

                // 更新這首歌的最佳紀錄
                const best = bestScores[currentSong];
                if (best === undefined || savedCount > best) {
                    bestScores[currentSong] = savedCount;
                    syncScores(); // 最佳成績有變，上傳到老師的試算表
                }
                // 完成：還原進度換成「成功還原」
                document.getElementById('successBanner').innerHTML = `成功還原歌詞，省下<span class="text-3xl text-red-600 mx-1 leading-none">${savedCount}</span>字`;
                showSolved('solved');
            } else {
                solvedTime = null;
                // 有錯：顯示「錯誤請修正」；目前都正確：顯示還原進度
                showSolved(matchLen < prevClean.length ? 'error' : 'progress');
            }
            renderScoreboard();
        }

        // 切換右下角：progress (還原進度) / error (錯誤請修正) / solved (成功還原)
        function showSolved(state) {
            if (state === true) state = 'solved';
            if (state === false) state = 'progress';
            document.getElementById('progressLine').classList.toggle('hidden', state !== 'progress');
            document.getElementById('errorBox').classList.toggle('hidden', state !== 'error');
            document.getElementById('successBanner').classList.toggle('hidden', state !== 'solved');
        }

        // 產生重組預覽：正確部分白色、錯誤部分紅色，
        // 選取的那一步用和原始歌詞相同的模組標示 (橘框 + 紅色代號圓標)
        function buildPreviewHTML(correctText, incorrectText, hlStart, hlEnd, hlId) {
            // 把每個字標上「第幾個非空白字」；空白則看它後面的字
            const chars = [];
            let idx = 0;
            [[correctText, 'text-white'], [incorrectText, 'text-red-500 font-bold']].forEach(([text, color]) => {
                for (const c of text) {
                    const ws = /\s/.test(c);
                    chars.push({ c, color, idx, ws });
                    if (!ws) idx++;
                }
            });
            // 字在範圍內就框起來；空白只有夾在框內的字之間才框
            const inside = (ch) => ch.ws ? (ch.idx > hlStart && ch.idx < hlEnd) : (ch.idx >= hlStart && ch.idx < hlEnd);

            let html = '', inMark = false, runColor = null, run = '';
            const flush = () => {
                if (run) html += `<span class="${runColor}">${esc(run)}</span>`;
                run = '';
            };
            chars.forEach(ch => {
                const ins = hlStart >= 0 && inside(ch);
                if (ins !== inMark) {
                    flush();
                    html += ins ? `<span class="mod-mark step-mark"><span class="mod-badge">${esc(hlId)}</span>` : '</span>';
                    inMark = ins;
                }
                // 標示內的正確文字沿用模組標示的顏色，錯誤文字仍為紅色
                const color = (ins && ch.color === 'text-white') ? '' : ch.color;
                if (color !== runColor) { flush(); runColor = color; }
                run += ch.c;
            });
            flush();
            if (inMark) html += '</span>';
            return html;
        }

        // ===================== 上傳成績到老師的試算表 =====================
        // 只有透過 Google Apps Script 網頁應用程式開啟時才會上傳；
        // 直接開啟 HTML 檔 (或放在 GitHub) 時不會上傳，其他功能照常。

        const hasServer = typeof google !== 'undefined' && !!google.script && !!google.script.run;
        let userEmail = '';

        function setSyncStatus(text, color) {
            const el = document.getElementById('syncStatus');
            el.textContent = text;
            el.className = color || 'text-gray-400';
        }

        function initAccount() {
            if (!hasServer) return;
            document.getElementById('accountInfo').classList.remove('hidden');
            setSyncStatus('讀取帳號中…');
            google.script.run
                .withSuccessHandler(email => {
                    userEmail = email;
                    if (email) {
                        document.getElementById('accountEmail').textContent = '👤 ' + email;
                        setSyncStatus('完成一首歌後，成績會自動上傳');
                    } else {
                        document.getElementById('accountEmail').textContent = '⚠️ 未取得學校帳號';
                        setSyncStatus('成績不會上傳，請改用學校帳號登入', 'text-amber-400');
                    }
                })
                .withFailureHandler(() => setSyncStatus('⚠️ 無法連線，成績不會上傳', 'text-amber-400'))
                .getUserEmail();
        }

        function syncScores() {
            if (!hasServer || !userEmail) return;
            setSyncStatus('☁️ 成績上傳中…', 'text-sky-300');
            google.script.run
                .withSuccessHandler(() => setSyncStatus('☁️ 成績已上傳', 'text-emerald-400'))
                .withFailureHandler(err => {
                    setSyncStatus('⚠️ 上傳失敗，下次完成時會再試', 'text-red-400');
                    showMessage('成績上傳失敗：' + (err && err.message ? err.message : '請檢查網路'));
                })
                .saveScores(Object.assign({}, bestScores));
        }

        // ===================== 正上方：五首歌成績列 =====================

        function selectSong(key) {
            document.getElementById('songSelector').value = key;
            changeSong();
        }

        function renderScoreboard() {
            const bar = document.getElementById('scoreboard');
            const options = [...document.getElementById('songSelector').options];
            let total = 0, solvedCount = 0;
            let html = '<span class="text-gray-400 text-sm font-bold shrink-0 mr-1">🏆 任務</span>';

            options.forEach(opt => {
                const key = opt.value;
                const name = opt.text.replace(/^\d+\.\s*/, '');
                const best = bestScores[key];
                const isCurrent = key === currentSong;
                const ring = isCurrent ? ' ring-2 ring-orange-500 ring-offset-1 ring-offset-black' : '';
                let cls, status;
                if (best !== undefined) {
                    total += best;
                    solvedCount++;
                    if (best >= maxSaves[key]) {
                        cls = 'bg-yellow-500 border-yellow-300 text-black hover:bg-yellow-400';
                        status = `完美省 <b>${best}</b> 字`;
                    } else {
                        cls = 'bg-yellow-500/15 border-yellow-500 text-yellow-300 hover:bg-yellow-500/25';
                        status = `省 <b class="text-white">${best}</b> 字`;
                    }
                } else {
                    const s = key === currentSong ? { modules } : songStates[key];
                    const started = s && s.modules.length > 0;
                    cls = 'bg-gray-800/60 border-gray-700 text-gray-400 hover:bg-gray-700';
                    status = started ? '進行中' : '未挑戰';
                }
                html += `<button onclick="selectSong('${key}')" title="切換到「${name}」" class="border rounded-full px-3 py-1 text-sm transition-colors whitespace-nowrap ${cls}${ring}"><span class="font-bold">${name}</span>　${status}</button>`;
            });

            html += `<span class="ml-auto text-sm text-gray-400 shrink-0">完成 <b class="text-white">${solvedCount}</b>/${options.length} 首${lastSolvedStamp ? `<span class="text-xs text-gray-500 ml-2">${lastSolvedStamp}</span>` : ''}</span>`;
            bar.innerHTML = html;
        }
    </script>
</body>
</html>
